<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — StudyFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="load" id="loader-overlay"><div class="load-brand"><span class="brand-mark">✓</span><span>Studyflow</span></div><div class="load-spinner"></div></div>
  <div class="toast-container" id="toast-container"></div>

  <div class="auth-wrapper">
    <div class="not-found-card" style="max-width: 500px; width: 100%;">
      <h1>404</h1>
      <h2>Oops! Page Graduated Early</h2>
      <p style="color: var(--muted); margin-bottom: 24px;">The page you are looking for doesn't exist or has been moved.</p>
      <a class="button button-primary button-small" href="dashboard.html">Back to Dashboard <span>→</span></a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
